name: Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

            - name: Deploy public/ files
              run: |
                  rsync -avz --delete --omit-dir-times \
                  -e "ssh -i ~/.ssh/deploy_key" \
                  public/ ${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.DEPLOY_PATH }}/public/

            - name: Deploy root-level files
              run: |
                  rsync -avz --delete --omit-dir-times \
                  --exclude 'public/' \
                  --exclude '.git/' \
                  --exclude '.github/' \
                  --exclude 'config.json' \
                  --exclude 'README.md' \
                  -e "ssh -i ~/.ssh/deploy_key" \
                  ./ ${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.DEPLOY_PATH }}/

            - name: Clean up key
              if: always()
              run: rm -f ~/.ssh/deploy_key
